openapi: 3.0.3
info:
  title: Contoso Students API
  version: 1.0.0
  description: |
    Student-owned record lookup. Enrollment and course details are composed
    by consumers and are not returned by this service.
paths:
  /api/v1/students/{id}:
    get:
      operationId: getStudent
      description: |
        Delegated access requires the students.read scope and Reader or
        Registrar app role. App-only access requires the Students.Lookup
        app role and an idtyp=app claim.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int32
      responses:
        '200':
          description: The requested student.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Student'
        '401':
          description: Missing or invalid authentication.
        '403':
          description: The authenticated caller lacks required permissions.
        '404':
          description: The student does not exist.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Student:
      type: object
      required: [id, firstName, lastName, enrollmentDate]
      properties:
        id:
          type: integer
          format: int32
        firstName:
          type: string
        lastName:
          type: string
        enrollmentDate:
          type: string
          format: date-time
