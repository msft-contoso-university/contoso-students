name: Student API CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: 10.0.404
      - name: Restore locked dependencies
        run: dotnet restore Contoso.Students.sln --locked-mode
      - name: Test
        run: dotnet test Contoso.Students.sln --no-restore --configuration Release
        env:
          CONTOSO_PRODUCER_SAMPLES: ${{ runner.temp }}/students-response-samples
      - name: Upload HTTP producer samples
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: producer-response-samples-${{ github.sha }}
          path: ${{ runner.temp }}/students-response-samples/*.json
          if-no-files-found: error
      - name: Test migration and seed against disposable SQL Server
        shell: bash
        run: |
          set -euo pipefail
          name="students-sql-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          password="Aa1!$(openssl rand -hex 24)"
          trap 'docker rm --force "$name" >/dev/null 2>&1 || true' EXIT
          docker run --detach --name "$name" -p 127.0.0.1:1433:1433 \
            -e ACCEPT_EULA=Y -e MSSQL_SA_PASSWORD="$password" \
            mcr.microsoft.com/mssql/server@sha256:db9a8fe3098b7e8bbde41106bdc7caee942e97124e5fdb71b872ca208de3092d >/dev/null
          export STUDENTS_SQL_TEST_CONNECTION_STRING="Server=127.0.0.1,1433;User ID=sa;Password=$password;Encrypt=True;TrustServerCertificate=True;Connect Timeout=2"
          dotnet test tests/Contoso.Students.Tests/Contoso.Students.Tests.csproj --no-restore --configuration Release --filter FullyQualifiedName~SqlSeedIntegrationTests
